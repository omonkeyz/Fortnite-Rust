[package]
name = "fn-manifest"
version.workspace = true
edition.workspace = true
description = "Generate the tools/asset-manifest.json that fn-export consumes, from a Fortnite install's paks and the runtime's own asset lists"

[dependencies]
fn-pak = { path = "../fn-pak" }
fn-pose = { path = "../fn-pose", default-features = false }
fn-legacy = { path = "../fn-legacy" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
