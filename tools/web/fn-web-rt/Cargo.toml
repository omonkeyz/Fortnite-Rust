[package]
name = "fn-web-rt"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser platform layer of the Fortnite 1.8 browser port: implements the FNWEB std hooks (tools/web/std-patch) on wasm32 + atomics: virtual file system over the local launcher's HTTP API, Web Worker thread pool, clocks, console, environment"

# Not a member of the native workspace (crates/*): built only by tools/web/build.sh for wasm32-unknown-unknown. On other targets the crate is empty.

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
dlmalloc = { version = "0.2.14", default-features = false }
