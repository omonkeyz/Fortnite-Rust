  #fnweb-status .s { color: var(--dim); margin-top: 6px; }

  #fnweb-error h1 { font-size: 20px; color: var(--bad); margin: 0 0 12px; }

  @media (prefers-reduced-motion: reduce) { #fnweb-busy { animation-duration: 3s; } }
  #fnweb-dl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font: 12px/1.3 ui-monospace, Consolas, monospace; color: rgba(255,255,255,.8);
    text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 6; display: none; }
  #fnweb-note { position: fixed; left: 10px; top: 8px; font: 12px/1.3 ui-monospace, Consolas, monospace; color: rgba(255,255,255,.72); text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; z-index: 5; }
</style>
