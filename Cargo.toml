[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
glam = "0.32.1"
serde_json = "1"
gltf = "1.4.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl", "metal", "gles"] }
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Fast iteration profile: `cargo run --profile fast -p fn-app --bin fortnite-rs` (alias: `cargo g`).
# Same game speed class as release but incremental, no LTO, many codegen units; third-party crates (wgpu, image, ...)
# stay fully optimised and are compiled once, so only the project's own crates rebuild after an edit.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false
debug = false

[profile.fast.package."*"]
opt-level = 3
codegen-units = 16
incremental = false

